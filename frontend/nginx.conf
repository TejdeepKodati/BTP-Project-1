server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The frontend's JS always calls relative "/api/..." paths (see
    # frontend/js/api.js) — nginx is what turns that into a call to the
    # backend container, so the frontend never hardcodes a backend host.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
    }

    location /healthz {
        proxy_pass http://backend:8080/healthz;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json;
}
